version: '3.8'

services:
  # 1. MySQL 8.0 数据库
  mysql:
    image: mysql:8.0.33
    container_name: flight-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flight_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # 2. Redis 7.0 缓存与分布式锁
  redis:
    image: redis:7.0-alpine
    container_name: flight-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass 123456
    volumes:
      - ./redis/data:/data

  # 3. RocketMQ 5.1.4 - NameServer
  rmqnamesrv:
    image: apache/rocketmq:5.1.4
    container_name: rmqnamesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  # 4. RocketMQ 5.1.4 - Broker (支持延时消息与异步解耦)
  rmqbroker:
    image: apache/rocketmq:5.1.4
    container_name: rmqbroker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: "rmqnamesrv:9876"
    command: sh mqbroker
    depends_on:
      - rmqnamesrv

  # 5. RocketMQ 控制台仪表盘 Dashboard
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    restart: always
    ports:
      - "8088:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rmqnamesrv:9876"
    depends_on:
      - rmqnamesrv
