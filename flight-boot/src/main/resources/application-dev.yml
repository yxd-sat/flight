spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flight_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      #password: "123456"
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: flight-order-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

jwt:
  secret: FlightBookingSystemTopSecretKeyMustBeLongEnoughForHS256Algorithm
  expiration: 86400000
