server:
  port: 8081
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: flight-booking-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
